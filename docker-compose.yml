services:
  proxy:
    build:
      context: .
    ports:
      - "127.0.0.1:11435:11435"
    environment:
      AUTH_ROOT: /auth
    volumes:
      - auth:/auth
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  auth:
